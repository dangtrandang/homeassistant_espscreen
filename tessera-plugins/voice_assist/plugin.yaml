# What a screen gets when it takes this plugin: a wake word that runs on the screen itself, Home Assistant's Assist
# pipeline for everything after it, and two settings. The microphone and the media player are the screen's
# (ts_microphone, ts_media_player: the features this plugin needs), so nothing here owns a bus or a pin.

# The wake words, all three on the screen; Wake phrase chooses the one that listens.
micro_wake_word:
  id: va_wake
  microphone:
    microphone: ts_microphone
    channels: 0
  stop_after_detection: false
  vad:
    probability_cutoff: 35%
  models:
    - model: okay_nabu
      id: va_okay_nabu
      probability_cutoff: 86%
      sliding_window_size: 5
    - model: hey_jarvis
      id: va_hey_jarvis
      probability_cutoff: 86%
      sliding_window_size: 5
    - model: hey_mycroft
      id: va_hey_mycroft
      probability_cutoff: 85%
      sliding_window_size: 5
  on_wake_word_detected:
    - lambda: 'id(va_plugin).on_wake();'
    - voice_assistant.start:
        wake_word: !lambda return wake_word;

# Home Assistant's Assist pipeline: what the screen hears goes to Home Assistant, the answer comes back on the screen's
# media player, which ducks music for it.
voice_assistant:
  id: va_assistant
  microphone:
    microphone: ts_microphone
    channels: 0
  speaker: ts_announcement_input
  micro_wake_word: va_wake
  use_wake_word: false
  noise_suppression_level: 1
  auto_gain: 31dBFS
  volume_multiplier: 2.0
  # The wake word and a session go through the screen's audio owner (plugin API 0.19): listen() and session() claim the
  # microphone and the speaker as the voice, and a doorbell's ring takes them (components/voice_assist).
  on_client_connected:
    - if:
        condition:
          switch.is_on: va_wake_word
        then:
          - lambda: 'id(va_plugin).listen(true);'
  on_client_disconnected:
    - lambda: 'id(va_assistant)->request_stop();'
  on_listening:
    - lambda: 'id(va_plugin).wake_screen(); id(va_plugin).session(true); id(va_plugin).phase(esphome::voice_assist::Phase::LISTENING);'
  on_stt_vad_end:
    - lambda: 'id(va_plugin).phase(esphome::voice_assist::Phase::THINKING);'
  on_stt_end:
    - lambda: 'id(va_plugin).heard(x);'
  on_tts_start:
    - lambda: 'id(va_plugin).answer(x);'
  # The answer goes to the media player: as it streams (x is its address once Assist has said enough to start) or
  # once it was made (tts_end). The words in the popup follow from when it is heard.
  on_intent_progress:
    - lambda: 'id(va_plugin).speaking(x);'
  on_tts_end:
    - lambda: 'id(va_plugin).speaking(x);'
  on_end:
    - lambda: 'id(va_plugin).ended(); id(va_plugin).wake_screen();'
  on_error:
    - lambda: 'id(va_plugin).failed(code, message);'

# The settings, kept on the screen and shown in Home Assistant, on the screen's settings page and in the editor.
switch:
  - platform: template
    id: va_wake_word
    name: "Từ đánh thức"
    icon: mdi:account-voice
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
    on_turn_on:
      - if:
          condition:
            api.connected:
          then:
            - lambda: 'id(va_plugin).listen(true);'
    on_turn_off:
      - lambda: 'id(va_plugin).listen(false);'
  # Its two sounds on the screen's speaker: when it starts to listen, and a plop again and again while Assist thinks.
  - platform: template
    id: va_wake_sound
    name: "Âm thanh đánh thức"
    icon: mdi:bell-ring
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
  - platform: template
    id: va_thinking_sound
    name: "Âm thanh đang xử lý"
    icon: mdi:timer-sand
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config

  # The popup of a question over the screen (plugin API 0.18): what it heard and the answer as it is spoken.
  - platform: template
    id: va_show_popup
    name: "Hiện popup"
    icon: mdi:message-text
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
    on_turn_off:
      - lambda: 'id(va_plugin).popup_off();'

select:
  - platform: template
    id: va_wake_phrase
    name: "Cụm từ đánh thức"
    icon: mdi:chat-processing
    optimistic: true
    restore_value: true
    options: ["Okay Nabu", "Hey Jarvis", "Hey Mycroft"]
    initial_option: "Okay Nabu"
    entity_category: config
    on_value:
      - lambda: 'id(va_plugin).choose_phrase(i);'
  - platform: template
    id: va_mic_gain
    name: "Khuếch đại micro"
    icon: mdi:microphone-settings
    optimistic: true
    restore_value: true
    options: ["18 dB", "24 dB", "30 dB", "36 dB"]
    initial_option: "30 dB"
    entity_category: config
    on_value:
      - lambda: |-
          static constexpr uint8_t regs[] = {3, 4, 5, 6};
          if (i < 4) {
            id(ts_audio_dac)->write_byte(0x16, regs[i]);
            ESP_LOGI("voice_assist", "ES8311 mic gain set to %s (reg 0x16 = %u)", x.c_str(), regs[i]);
          }

number:
  - platform: template
    id: va_wake_cutoff
    name: "Ngưỡng đánh thức"
    icon: mdi:tune-vertical
    optimistic: true
    restore_value: true
    initial_value: 86
    min_value: 75
    max_value: 99
    step: 1
    unit_of_measurement: "%"
    entity_category: config
    on_value:
      - lambda: 'id(va_plugin).set_cutoff(x);'

voice_assist:
  id: va_plugin
  assistant: va_assistant
  wake_word: va_wake
  wake_word_on: va_wake_word
  wake_phrase: va_wake_phrase
  wake_cutoff: va_wake_cutoff
  mic_gain: va_mic_gain
  phrases: [va_okay_nabu, va_hey_jarvis, va_hey_mycroft]
  speaker: ts_speaker
  media_player: ts_media_player
  wake_sound_on: va_wake_sound
  thinking_sound_on: va_thinking_sound
  show_popup_on: va_show_popup
