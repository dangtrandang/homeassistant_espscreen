# ==============================================================================
# Tessera (homeassistant_espscreen) Configuration for Freenove ESP32-S3 2.8" Touch
# Board: Freenove FNK0104 (2.8 inch Capacitive Touch - ILI9341 IPS + FT6336)
# ==============================================================================

substitutions:
  DEVICE_NAME: "freenove-28-screen"
  DEVICE_FRIENDLY_NAME: "Freenove 2.8 Screen"
  GITHUB_REF: "main"
  FONT_DIR: "https://raw.githubusercontent.com/dangtrandang/homeassistant_espscreen/${GITHUB_REF}/fonts"

  # Đặt BOARD_ID là "cyd" để Tessera Screen Manager nhận diện đúng kích thước màn hình 2.8" (320x240 / 240x320)
  BOARD_ID: "cyd"

  # Thông số màn hình vật lý 2.8" ILI9341 IPS
  PANEL_W: "240"
  PANEL_H: "320"
  DISPLAY_DPI: "143"

  # Xoay màn hình: 90 độ cho chế độ nằm ngang (Landscape 320x240)
  ROTATION_LANDSCAPE: "90"

  # Lưới ô (Grid tiles)
  GRID_COLS: "2"
  GRID_ROWS: "3"
  GRID_COLS_PORTRAIT: "1"
  GRID_ROWS_PORTRAIT: "4"
  LVGL_BUFFER_SIZE: "12%"

  # Nhờ có Octal PSRAM, màn hình hỗ trợ số lượng trang và thẻ nhiều hơn
  SCREEN_MAX_TILES: "128"
  SCREEN_MAX_PAGES: "24"
  SCREEN_MAX_BAR_ITEMS: "8"

  BACKLIGHT_FREQUENCY: "20000Hz"
  AUTO_DIM_TIMEOUT: "3"

  # Bổ sung đầy đủ bộ ký tự tiếng Việt có dấu cho toàn bộ font chữ trên màn hình
  SCRIPT_GLYPHS: "ẠẢẤẦẨẪẬẮẰẲẴẶẸẺẼẾỀỂỄỆỈỊỌỎỐỒỔỖỘƠỚỜỞỠỢỤỦỨỪỬỮỰỲỴỶỸạảấầẩẫậắằẳẵặẹẻẽếềểễệỉịọỏốồổỗộơớờởỡợụủứừửữựỳỵỷỹ₫"

  # Thông số Audio chuẩn Tessera cho chip ES8311 trên Freenove FNK0104B
  AUDIO_SAMPLE_RATE: "16000"
  AUDIO_DOUT_PIN: GPIO8
  AUDIO_DIN_PIN: GPIO6
  AUDIO_DAC_DB_AT_0: "-95.5"
  AUDIO_DAC_DB_AT_1: "32"
  AUDIO_VOLUME_DB_LOW: "-25"
  AUDIO_VOLUME_DB_HIGH: "20"
  BOOT_BOARD_SETTINGS: |-
    id(ts_microphone)->start();
    id(ts_media_player).make_call().set_volume(0.85f).perform();

esphome:
  name: ${DEVICE_NAME}
  friendly_name: ${DEVICE_FRIENDLY_NAME}
  min_version: 2024.6.0
  includes:
    - tcp_tunnel.h
  on_boot:
    priority: -200
    then:
      - lambda: |-
          esphome::homeassistant::global_homeassistant_time = nullptr;
          id(homeassistant_time).stop_poller();
          tcp_tunnel::start_tcp_tunnel();

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  cpu_frequency: 240MHz

# Bật Octal PSRAM của bo mạch Freenove ESP32-S3
psram:
  mode: octal
  speed: 80MHz

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  manual_ip:
    static_ip: 192.168.1.200
    gateway: 192.168.1.1
    subnet: 255.255.255.0
    dns1: 8.8.8.8
    dns2: 1.1.1.1

ota:
  - platform: esphome

time:
  - platform: sntp
    id: sntp_time
    timezone: "ICT-7"
    servers:
      - 216.239.35.0
      - 162.159.200.1
      - 0.pool.ntp.org
    on_time_sync:
      then:
        - script.execute:
            id: apply_screen_settings
            minute: true

logger:
  level: DEBUG

# Tích hợp trực tiếp các module chức năng từ thư mục local đã patch của Tessera
packages:
  core: !include packages/core.yaml
  build: !include packages/hardware/esp-idf.yaml
  look: !include packages/looks/compact.yaml
  touch: !include packages/features/capacitive-touch.yaml
  backlight: !include packages/features/backlight.yaml
  self_test: !include packages/features/self-test.yaml
  audio: !include packages/features/audio.yaml
  voice_assist: !include tessera-plugins/voice_assist/plugin.yaml

external_components:
  - source:
      type: local
      path: components
    components: [smart_display]
  - source:
      type: local
      path: tessera-plugins/voice_assist/components
    components: [voice_assist]

# Cấu hình chân kết nối phần cứng Freenove ESP32-S3 2.8" (FNK0104)

# 1. SPI Bus cho màn hình LCD
spi:
  id: lcd
  clk_pin: GPIO12
  mosi_pin: GPIO11

# 2. I2C Bus cho cảm ứng FT6336/FT63x6
i2c:
  id: touch_bus
  sda: GPIO16
  scl: GPIO15
  scan: true

# 3. Đèn nền màn hình (Backlight PWM qua GPIO45)
output:
  - platform: ledc
    pin:
      number: GPIO45
      ignore_strapping_warning: true
    id: gpio_backlight_pwm
    frequency: ${BACKLIGHT_FREQUENCY}

# 4. Màn hình ILI9341 IPS 240x320
display:
  - platform: mipi_spi
    id: my_display
    model: ILI9341
    spi_id: lcd
    dimensions:
      width: 240
      height: 320
    cs_pin: GPIO10
    dc_pin:
      number: GPIO46
      ignore_strapping_warning: true
    invert_colors: true
    data_rate: 40MHz
    update_interval: never
    auto_clear_enabled: false

# 5. Cảm ứng điện dung FT63x6
touchscreen:
  - platform: ft63x6
    id: ts_touch
    i2c_id: touch_bus
    display: my_display
    interrupt_pin: GPIO17
    reset_pin: GPIO18
    update_interval: 20ms

# 6. Cụm âm thanh ES8311 (Mic + Loa) & Amplifier theo kiến trúc Tessera
i2s_audio:
  - id: ts_speaker_bus
    i2s_bclk_pin: {number: GPIO5, allow_other_uses: true}
    i2s_lrclk_pin: {number: GPIO7, allow_other_uses: true}
  - id: ts_mic_bus
    i2s_mclk_pin: GPIO4
    i2s_bclk_pin: {number: GPIO5, allow_other_uses: true}
    i2s_lrclk_pin: {number: GPIO7, allow_other_uses: true}

speaker:
  - id: !extend ts_speaker_out
    i2s_mode: secondary

audio_dac:
  - platform: es8311
    id: ts_audio_dac
    i2c_id: touch_bus
    address: 0x18
    sample_rate: ${AUDIO_SAMPLE_RATE}
    bits_per_sample: 16bit
    use_mclk: true
    use_microphone: false
    mic_gain: 36DB

switch:
  - platform: gpio
    id: board_speaker_amp
    internal: true
    pin:
      number: GPIO1
      inverted: true
    restore_mode: ALWAYS_ON
